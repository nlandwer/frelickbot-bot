name: Post Game of the Day

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

jobs:
  post-gotd:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create session file
        run: |
          cat > session.json <<'EOF'
          {
            "authInfo": "${{ secrets.REAL_AUTH_INFO }}",
            "deviceUuid": "${{ secrets.REAL_DEVICE_UUID }}"
          }
          EOF

      - name: Create Google credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: Post GOTD
        env:
          REAL_GROUP_ID: ${{ secrets.REAL_GROUP_ID }}
          REAL_TURNSTILE_TOKEN: ${{ secrets.REAL_TURNSTILE_TOKEN }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: npm run gotd